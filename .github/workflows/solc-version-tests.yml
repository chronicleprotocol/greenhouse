name: Solc Version Tests

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@f43a0e5ff2bd294095638e18286ca9a3d1956744
        with:
          submodules: recursive
      - run: yarn install

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@c7450ba673e133f5ee30098b3b54f444d3a2ca2d
        with:
          version: nightly

      - name: Install deps
        run: forge soldeer install

      - name: Run Forge tests for each supported solc version
        run: >
          FOUNDRY_PROFILE=ci forge test --use 0.8.24 &&
          FOUNDRY_PROFILE=ci forge test --use 0.8.25 &&
          FOUNDRY_PROFILE=ci forge test --use 0.8.26 &&
          FOUNDRY_PROFILE=ci forge test --use 0.8.27
